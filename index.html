<div id="fatal" hidden role="alert"><h2>문제가 생겼어요</h2><p>기록을 보관했어요. 화면을 다시 열어 주세요.</p><button class="button primary" onclick="location.reload()">새로고침</button></div>
<script>// ══ 임시표 마법 공방 · 이론 엔진 ══
// 순수 함수만 둔다. DOM과 오디오를 만지지 않는다.
// 적어 두는 것은 음이름의 차례와 장음계의 온음·반음 공식 하나뿐이다. 높이, 조표, 효력, 정답, 오답 원인은 규칙으로 만든다.

// ── 분수: 길이는 분수로만 계산한다 ──
const gcd = (a, b) => (b ? gcd(b, a % b) : Math.abs(a));
const F = (n, d = 1) => { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d) || 1; return { n: n / g, d: d / g }; };
const add = (a, b) => F(a.n * b.d + b.n * a.d, a.d * b.d);
const eq = (a, b) => a.n === b.n && a.d === b.d;
const num = (a) => a.n / a.d;
const noteWhole = (den, dots = 0) => F(2 ** (dots + 1) - 1, den * 2 ** dots);            // 온음표 = 1

// ── 높이 ──
const LETTERS = "CDEFGAB";
const MAJOR = [2, 2, 1, 2, 2, 2, 1];                                                    // 장음계: 온 온 반 온 온 온 반
const natPc = (L) => MAJOR.slice(0, L).reduce((s, x) => s + x, 0);                       // C 0 · D 2 · E 4 · F 5 · G 7 · A 9 · B 11
const midiOf = (L, o, alter = 0) => 12 * (o + 1) + natPc(L) + alter;                     // C4 = 60
const hz = (midi) => 440 * Math.pow(2, (midi - 69) / 12);
const isWhite = (midi) => MAJOR.some((_, L) => natPc(L) === ((midi % 12) + 12) % 12);
const stepOf = (L, o) => o * 7 + L;                                                      // 오선의 계단. 줄이나 칸 하나가 한 계단이다

// ── 조표: 5도권 규칙 ──
const sharpAt = (k) => (3 + 4 * k) % 7;                                                  // F C G D A E B (5도씩 위)
const flatAt = (k) => (6 + 3 * k) % 7;                                                   // B E A D G C F (4도씩 위)
const keyLetters = (key) => Array.from({ length: Math.abs(key) }, (_, k) => (key > 0 ? sharpAt(k) : flatAt(k)));
const keyAlter = (key, L) => (keyLetters(key).includes(L) ? Math.sign(key) : 0);
// 조표 기호를 그리는 계단(높은음자리표). 샵은 A4~G5, 플랫은 F4~E5의 일곱 계단 안에 하나씩 놓인다
const keySteps = (key) => keyLetters(key).map((L) => { const lo = key > 0 ? stepOf(5, 4) : stepOf(3, 4); let s = stepOf(L, 4); while (s < lo) s += 7; while (s > lo + 6) s -= 7; return s; });

// ── 악보 씨앗 읽기 ──
// "k1 4/4 | r/2. F#4/4~ | F4/4 F4/4* r/2 |"  k = 조표(샵 +, 플랫 −) · 박자 · | 마디선
// 음표 = 음이름 [# b n x bb ?] 옥타브 / 음표 분모 [.]   ? = 빈 표 자리(플레이어가 채운다)
// 뒤에 붙는 표시: ~ 붙임줄  * 표적  @ 효력의 출발  ^ 종류를 묻는 곡선  ( ) 이음줄
const ACC = { "#": 1, x: 2, b: -1, bb: -2, n: 0 };
function parseScore(src) {
  const t = src.trim().split(/\s+/), [mn, md] = t[1].split("/").map(Number);
  const sc = { key: Number(t[0].slice(1)), mn, md, meter: F(mn, md), notes: [], slurs: [], bars: 0 };
  let bar = -1, open = -1;
  for (const w of t.slice(2)) {
    if (w === "|") { bar++; continue; }
    const m = /^(\()?(r|[A-G])(bb|b|#|x|n|\?)?(\d)?\/(\d+)(\.*)([~*@^]*)(\))?$/.exec(w);
    if (!m) throw new Error("씨앗을 읽을 수 없다: " + w);
    const i = sc.notes.length, rest = m[2] === "r", fl = m[7];
    if (m[1]) open = i;
    sc.notes.push({ rest, L: rest ? -1 : LETTERS.indexOf(m[2]), o: rest ? 0 : Number(m[4]), acc: m[3] === undefined || m[3] === "?" ? null : ACC[m[3]], dur: noteWhole(Number(m[5]), m[6].length), bar,
      tie: fl.includes("~"), target: fl.includes("*"), source: fl.includes("@"), blank: m[3] === "?", curve: fl.includes("^") });
    if (m[8]) { sc.slurs.push([open, i]); open = -1; }
  }
  sc.bars = bar;
  return sc;
}
const withAcc = (sc, i, acc) => Object.assign({}, sc, { notes: sc.notes.map((n, k) => (k === i ? Object.assign({}, n, { acc }) : n)) });
const sameSlot = (a, b) => !a.rest && !b.rest && a.L === b.L && a.o === b.o;
// 곡선 읽기: 같은 줄·칸의 이웃한 두 음을 잇고 뒤 음에 새 표가 없으면 붙임줄, 아니면 이음줄
const linkKind = (sc, i) => { const a = sc.notes[i], b = sc.notes[i + 1]; return b && sameSlot(a, b) && b.acc === null ? "tie" : "slur"; };
const tiedOn = (sc, i) => { const n = sc.notes[i]; return !!n && !n.rest && (n.tie || (n.curve && linkKind(sc, i) === "tie")); };

// ── 효력 계산 ──
// 새로 내는 음: 이 음표의 표 → 같은 마디·같은 줄칸의 기억 → 조표.  이어받는 음(붙임줄): 앞 소리 그대로. 기억을 고쳐 쓰지 않는다.
// m은 오개념 모델이다. 비워 두면 표준 규칙이다.
function evaluate(sc, m = {}) {
  const out = [];
  let mem = new Map(), bar = 0;
  const slotOf = (n) => (m.memByLetter ? n.L : stepOf(n.L, n.o));
  const keyOf = (n) => (m.ignoreKey ? 0 : m.keyOneOctave ? (keySteps(sc.key).includes(stepOf(n.L, n.o)) ? Math.sign(sc.key) : 0) : keyAlter(sc.key, n.L));
  sc.notes.forEach((n, i) => {
    if (n.bar !== bar) {                                                                  // 마디선: 마디 기억을 비운다
      bar = n.bar;
      if (!(m.noBarReset || (m.slurHoldsMem && sc.slurs.some(([a, b]) => a < i && i <= b)))) mem = new Map();
    }
    if (n.rest) { out.push({ i, rest: true }); return; }
    const p = i > 0 ? sc.notes[i - 1] : null, cont = tiedOn(sc, i - 1) && sameSlot(p, n);
    const kd = keyOf(n), slot = slotOf(n), cur = mem.has(slot) ? mem.get(slot) : { alter: kd, by: kd ? -1 : null };
    let r;
    if (cont && !(m.tieBreaksAtBar && p.bar !== n.bar)) {                                 // 붙임줄로 이어받는 음
      const q = out[i - 1];
      r = { alter: q.alter, src: "tie", by: q.by };
      if (m.tieWritesMem) mem.set(slot, { alter: q.alter, by: q.by });
    } else if (n.acc !== null && !m.ignoreSigns) {                                        // 이 음표의 표: 더하지 않고 자리를 정한다
      let a = n.acc;
      if (m.flip) a = -a;
      if (m.doubleAsSingle) a = Math.sign(a);
      if (n.acc === 0) { if (m.natToKey) a = kd; else if (m.natOneStep) a = cur.alter - Math.sign(cur.alter); else if (m.natAsFlat) a = cur.alter - 1; }
      else if (m.additive) a = cur.alter + a;                                           // 믿는 대로 계산한다. 두 칸을 넘어도 자르지 않는다
      r = { alter: a, src: "sign", by: i };
      if (!m.noMemory && !(m.natNoMem && n.acc === 0)) mem.set(slot, { alter: a, by: i });
    } else {                                                                              // 표가 없는 음: 마디 기억 → 조표
      let c = cur, viaMem = mem.has(slot);
      if (m.backward && !viaMem) { const j = sc.notes.findIndex((x, k) => k > i && x.bar === n.bar && !x.rest && x.acc !== null && slotOf(x) === slot); if (j >= 0) { c = { alter: sc.notes[j].acc, by: j }; viaMem = true; } }
      r = { alter: c.alter, src: viaMem ? "mem" : kd ? "key" : "plain", by: c.by };
    }
    let midi = midiOf(n.L, n.o, r.alter);
    if (r.src === "sign" && Math.abs(n.acc) === 1) {                                      // 건반 색 오개념은 한 칸짜리 표에만 건다
      const d = Math.sign(r.alter) || n.acc;
      if (m.blackOnly) while (isWhite(midi)) midi += d;
      if (m.whiteStep) { midi = midiOf(n.L, n.o) + d; while (!isWhite(midi)) midi += d; }
    }
    out.push({ i, midi, alter: r.alter, src: r.src, by: r.by, onset: !cont });
  });
  return out;
}
const pitches = (sc, m) => evaluate(sc, m).map((r) => (r.rest ? null : r.midi));
const sameList = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
// 없어도 소리가 같은 표
const redundant = (sc) => sc.notes.map((_, i) => i).filter((i) => !sc.notes[i].rest && sc.notes[i].acc !== null && sameList(pitches(withAcc(sc, i, null)), pitches(sc)));

// ── 오개념 모델: 같은 계산기에 스위치 하나씩. 적힌 차례가 오답 원인을 찾는 차례다 ──
const MODELS = {
  TIE_BAR: { tieBreaksAtBar: true },      // 붙임줄도 마디선에서 풀린다고 읽는다
  TIE_CARRY: { tieWritesMem: true },      // 붙임줄이 표를 새 마디로 옮긴다고 읽는다
  SLUR_CARRY: { slurHoldsMem: true },     // 이음줄이 표를 새 마디로 옮긴다고 읽는다
  NAT_KEY: { natToKey: true },            // 내추럴 = 조표로 돌아가기
  NAT_ONE: { natOneStep: true },          // 내추럴 = 한 칸만 지우기
  NAT_DOWN: { natAsFlat: true },          // 내추럴 = 한 칸 내리기
  NAT_ONCE: { natNoMem: true },           // 내추럴은 그 음표에만
  ADD: { additive: true },                // 표를 더한다
  HALF: { doubleAsSingle: true },         // 더블샵·더블플랫을 한 칸으로
  ALL_OCT: { memByLetter: true },         // 표가 다른 옥타브에도 닿는다
  NO_BAR: { noBarReset: true },           // 표가 마디선을 넘는다
  WHOLE_BAR: { backward: true },          // 표가 마디의 앞쪽 음에도 닿는다
  SIGN_ONLY: { noMemory: true },          // 표는 붙은 음표에만
  KEY_OCT: { keyOneOctave: true },        // 조표는 그려진 줄·칸에만
  NO_KEY: { ignoreKey: true },            // 조표를 빠뜨린다
  BLACK: { blackOnly: true },             // 샵·플랫 = 검은 건반
  WHITE: { whiteStep: true },             // 한 칸 = 옆 흰 건반
  DIR: { flip: true },                    // 위아래를 바꿔 읽는다
  PLAIN: { ignoreSigns: true, ignoreKey: true },   // 표를 빼고 읽는다
};

// ── 출제 검사 ──
const RANGE = [stepOf(6, 3), stepOf(6, 5)];                                              // B3~B5: 덧줄은 위아래 하나까지
function check(sc) {
  const bad = [];
  for (let b = 0; b < sc.bars; b++) if (!eq(sc.notes.filter((n) => n.bar === b).reduce((s, n) => add(s, n.dur), F(0)), sc.meter)) bad.push("BAR_LEN:" + b);
  sc.notes.forEach((n, i) => {
    if (n.rest) { if (n.tie || n.curve || n.target || n.blank) bad.push("REST_FLAG:" + i); return; }
    const s = stepOf(n.L, n.o), x = sc.notes[i + 1];
    if (s < RANGE[0] || s > RANGE[1]) bad.push("RANGE:" + i);
    if (n.tie && !(x && sameSlot(n, x))) bad.push("TIE_SLOT:" + i);                       // 붙임줄은 같은 줄·칸의 이웃한 음끼리만
    else if (n.tie && (x.acc !== null || x.blank)) bad.push("TIE_SIGN:" + i);             // 이어받는 음에는 표를 적지 않는다(높이가 달라지면 충돌)
    if (n.curve && !(x && !x.rest)) bad.push("CURVE_END:" + i);
  });
  sc.slurs.forEach(([a, b]) => {
    if (!(a >= 0 && b > a) || sc.notes[a].rest || sc.notes[b].rest) bad.push("SLUR_ENDS:" + a);
    else if (b - a === 1 && linkKind(sc, a) === "tie") bad.push("SLUR_READS_AS_TIE:" + a);  // 두 음만 잇는 곡선이 붙임줄로 읽히면 이음줄로 내지 않는다
  });
  return bad;
}

// ── 이름과 조사 ──
const SIGN_CH = { 2: "𝄪", 1: "♯", 0: "♮", "-1": "♭", "-2": "𝄫" };
const signKo = (a, style = "loan") => (Math.abs(a) === 2 ? (style === "ko" ? "겹" : "더블") : "") + (style === "ko" ? (a > 0 ? "올림표" : a < 0 ? "내림표" : "제자리표") : a > 0 ? "샵" : a < 0 ? "플랫" : "내추럴");
const signEn = (a) => (Math.abs(a) === 2 ? "double " : "") + (a > 0 ? "sharp" : a < 0 ? "flat" : "natural");
const notchKo = (a) => (a > 0 ? `위로 ${a}칸` : a < 0 ? `아래로 ${-a}칸` : "제자리");
const noteKo = (L, o, a = 0) => LETTERS[L] + (a ? SIGN_CH[a] : "") + (o === undefined ? "" : o);
const keyKo = (midi) => { const o = Math.floor(midi / 12) - 1, L = MAJOR.findIndex((_, k) => natPc(k) === ((midi % 12) + 12) % 12); return L >= 0 ? noteKo(L, o) : keyKo(midi - 1).replace(/(\d)$/, "♯$1") + "·" + keyKo(midi + 1).replace(/(\d)$/, "♭$1"); };
const hasBatchim = (w) => { const c = w.charCodeAt(w.length - 1); return c >= 0xac00 && c <= 0xd7a3 ? (c - 0xac00) % 28 !== 0 : /[013678]$/.test(w); };
const josa = (w, pair) => w + pair.split("/")[hasBatchim(w) ? 0 : 1];                    // josa("샵", "은/는") → "샵은"
const be = (w) => w + (hasBatchim(w) ? "이에요" : "예요");                                 // "G♯4예요", "F 자연음이에요"
const ro = (w) => { const c = w.charCodeAt(w.length - 1), rieul = c >= 0xac00 && c <= 0xd7a3 ? (c - 0xac00) % 28 === 8 : /[178]$/.test(w); return w + (hasBatchim(w) && !rieul ? "으로" : "로"); };   // "샵으로", "내추럴로", "F♯4로"


// ══ 임시표 마법 공방 · 의뢰 모델 ══
// 의뢰에는 씨앗만 적는다. 정답, 함정, 오답 원인, 문장, 건반 창, 소리 목록은 여기서 만든다.

const CARDS = [null, 1, -1, 0, 2, -2];                                                   // 없음 · 샵 · 플랫 · 내추럴 · 더블샵 · 더블플랫
const cardKo = (c) => (c === null ? "없음" : signKo(c));
const targetOf = (ms, sc) => (ms.ask === "fix" ? ms.bad.i : sc.notes.findIndex((n) => (ms.ask === "sign" ? n.blank : ms.ask === "reach" ? n.source : ms.ask === "link" ? n.curve : n.target)));

// 모델 m을 믿는 사람이 낼 답. 표준 규칙이면 m = {}
function answerUnder(ms, sc, m) {
  const t = targetOf(ms, sc), n = sc.notes[t];
  switch (ms.ask) {
    case "name": return n.acc;
    case "notch": return evaluate(sc, m)[t].midi - midiOf(n.L, n.o);
    case "key": return evaluate(sc, m)[t].midi;
    case "why": return evaluate(sc, m)[t].src;
    case "reach": return evaluate(sc, m).filter((r) => !r.rest && r.i !== t && r.by === t).map((r) => r.i).join(",");
    case "sign": { const want = midiOf(n.L, n.o, ms.want); return CARDS.find((c) => evaluate(withAcc(sc, t, c), m)[t].midi === want); }
    case "link": return linkKind(sc, t);
    default: return undefined;
  }
}
// 수리: 한 곳만 고쳐 바른 소리가 나고 군더더기 표가 없는 방법을 모두 찾는다
function fixes(sc, bad) {
  const want = pitches(sc), out = [];
  bad.notes.forEach((n, i) => {
    if (n.rest || tiedOn(bad, i - 1)) return;
    CARDS.forEach((c) => { if (c === n.acc) return; const x = withAcc(bad, i, c); if (sameList(pitches(x), want) && !redundant(x).length && !check(x).length) out.push({ i, acc: c }); });
  });
  return out;
}
function solve(ms) {
  const sc = parseScore(ms.s), t = targetOf(ms, sc);
  const view = ms.ask === "fix" ? withAcc(sc, ms.bad.i, ms.bad.acc) : sc;                // 화면에 그리는 악보
  const answer = ms.ask === "fix" ? fixes(sc, view) : answerUnder(ms, sc, {});
  const traps = {};                                                                      // 오개념 모델마다 표준과 다르게 나오는 답
  if (!["fix", "link", "name"].includes(ms.ask)) for (const [code, m] of Object.entries(MODELS)) { const a = answerUnder(ms, sc, m); if (a !== undefined && a !== answer) traps[code] = a; }
  return { ms, sc, view, t, answer, traps };
}
const isRight = (sol, given) => (sol.ms.ask === "fix" ? sol.answer.some((f) => f.i === given.i && f.acc === given.acc) : given === sol.answer);

// 오답의 원인 코드. 의뢰가 겨누는 오개념(aim)을 먼저 보고, 그다음 MODELS에 적힌 차례로 본다
function diagnose(sol, given) {
  const { ms, sc, view, t, answer, traps } = sol;
  if (isRight(sol, given)) return null;
  if (ms.ask === "fix") {
    if (given.i === t) return "FIX_CARD";
    const now = pitches(view), want = pitches(sc);
    return now[given.i] === want[given.i] ? "FIX_FINE" : "FIX_ROOT";
  }
  if (ms.ask === "link") return answer === "tie" ? "LINK_IS_TIE" : sameSlot(sc.notes[t], sc.notes[t + 1]) ? "LINK_SIGN" : "LINK_SLOT";
  if (ms.ask === "why") return "WHY";
  if (ms.ask === "name") return "NAME";
  const n = sc.notes[t];
  if (ms.ask === "sign" && answer === null && evaluate(withAcc(sc, t, given))[t].midi === midiOf(n.L, n.o, ms.want)) return "REDUNDANT";
  const hit = [ms.aim].concat(Object.keys(MODELS)).find((c) => c && traps[c] === given);
  if (hit) return hit;
  if (ms.ask === "key") return Math.abs(given - midiOf(n.L, n.o)) > 2 ? "FAR" : "OTHER";
  if (ms.ask === "reach") { const G = new Set(given.split(",")); return answer.split(",").some((x) => x && !G.has(x)) ? "MISS" : "EXTRA"; }
  return "OTHER";

// ── 건반 창: 의뢰에 필요한 건반만 보여 준다. 흰 건반이 cap을 넘으면 두 쪽으로 나눈다 ──
function keyWindow(sol, cap = 7) {
  const { sc, view, t } = sol, n = sc.notes[t], nat = midiOf(n.L, n.o), need = new Set(pitches(sc).concat(pitches(view)).filter((x) => x !== null));
  if (["reach", "why", "link"].includes(sol.ms.ask)) need.add(nat);                       // 고르기 의뢰: 악보의 소리와 표적의 자연음 자리만
  else for (let d = -2; d <= 2; d++) need.add(nat + d);                                  // 건반·표로 답하는 의뢰: 표적 음의 다섯 자리
  if (sol.ms.ask === "key") Object.values(sol.traps).forEach((k) => need.add(k));        // 오개념대로 누를 건반도 창 안에 둔다
  const ks = [...need].sort((a, b) => a - b), whites = (p) => { let w = 0; for (let k = p.lo; k <= p.hi; k++) if (isWhite(k)) w++; return w; };
  const pane = (lo, hi) => { while (!isWhite(lo)) lo--; while (!isWhite(hi)) hi++; const p = { lo, hi }; while (whites(p) < 3) { p.hi++; while (!isWhite(p.hi)) p.hi++; } return p; };
  let panes = [pane(ks[0], ks[ks.length - 1])];
  if (whites(panes[0]) > cap) {                                                          // 가장 넓은 빈틈에서 가른다
    let cut = 1; for (let i = 2; i < ks.length; i++) if (ks[i] - ks[i - 1] > ks[cut] - ks[cut - 1]) cut = i;
    if (ks[cut] - ks[cut - 1] > 4) panes = [pane(ks[0], ks[cut - 1]), pane(ks[cut], ks[ks.length - 1])];
  }
  return { panes, whites: panes.reduce((s, p) => s + whites(p), 0) };
}

// ── 소리 목록: 소리 하나 = 새로 내는 음 하나. 붙임줄로 이어진 음표는 한 소리로 합친다 ──
function sounds(sc) {
  const ev = evaluate(sc), out = [], inSlur = (i) => sc.slurs.some(([a, b]) => a <= i && i < b);
  let at = F(0);
  sc.notes.forEach((n, i) => {
    if (!n.rest) {
      if (ev[i].onset) out.push({ midi: ev[i].midi, at, len: n.dur, notes: [i], legato: inSlur(i) });
      else { const s = out[out.length - 1]; s.len = add(s.len, n.dur); s.notes.push(i); s.legato = inSlur(i); }
    }
    at = add(at, n.dur);
  });
  return out;
}
const hasPlay = (sc) => { const s = sounds(sc); return s.length >= 2 || s.some((x) => x.notes.length > 1); };   // 연주 단계가 있는 의뢰
const beats = (f, md) => num(f) * md;                                                    // 길이(온음표 = 1) → 박

// STATE: pure session operations; judgment is always delegated to the theory model.
const Session = {
  create(dayIndex, save) {
    const day = DAYS[dayIndex];
    const review = (save.review || []).filter(id => id.slice(0,2) !== day.id).slice(0,2);
    return { day: day.id, index: 0, queue: review.concat(day.list.map(x => x.id)), results: [] };
  },
  isExtra(session, id, index=session.index) {
    return !id.startsWith(session.day+'-') || session.queue.slice(0,index).includes(id);
  },
  repeat(session, mission) {
    if (mission.final || Session.isExtra(session, mission.id)) return session.queue;
    const queue = session.queue.slice();
    const final = queue.findIndex((id,i) => i > session.index && DAYS.flatMap(d=>d.list).find(m=>m.id===id)?.final);
    queue.splice(Math.min(session.index+4,final < 0 ? queue.length : final),0,mission.id);
    return queue;
  },
  summary(session) {
    const day = DAYS.find(d=>d.id===session.day);
    const main = session.results.filter(r=>!r.again);
    const full = main.filter(r=>r.mark===1 || r.mark==='full').length;
    const needed = Math.ceil(day.list.length*.8);
    const playable = main.filter(r=>hasPlay(solve(day.list.find(m=>m.id===r.id)).sc));
    const smooth = playable.length>0 && playable.every(r=>r.hand===1 || r.hand==='매끈');
    return {full,needed,total:day.list.length,passed:full>=needed,smooth};
  },
  unlock(save, index) { return index===0 || !!save.days[DAYS[index-1].id]?.passed; }
};

  workshop() {

      `<section class="panel free-compare-panel"><h2>오개념 비추기</h2><p>같은 악보를 다르게 읽으면 어떤 소리가 날까요?</p><label class="compare-label"><span>다르게 읽는 규칙</span><select id="free-model">${Object.keys(MODELS).map(code=>`<option value="${code}" ${code===f.model?'selected':''}>${Screens.causes[code]}</option>`).join('')}</select></label><button class="button secondary" id="free-compare">표준 소리와 비교 듣기</button><p class="compare-status" role="status"></p></section>`;

  freeStatus(text) {const node=this.content.querySelector('.free-status');if(node)node.textContent=text;}
  drawFree(rebuild=false) {

    Visuals.keyboard(this.content.querySelector('.free-keyboard'),{panes:[{lo,hi}],whites:Array.from({length:hi-lo+1},(_,j)=>lo+j).filter(isWhite).length},{selected:ev[f.i].midi,solfege:this.save.settings.solfege,onPress:m=>{this.audio.unlock();this.freeVoice.set(m,this.audio.press(m));},onRelease:m=>{this.audio.release(this.freeVoice.get(m));this.freeVoice.delete(m);}});

  editFree(action,acc) {

      if(n.tie)n.tie=false;else{const next=copy.notes[f.i+1];if(n.rest||!next||next.rest||!sameSlot(n,next))return this.freeStatus('같은 줄·칸의 이웃한 두 음만 붙임줄로 이을 수 있어요.');if(next.acc!==null)return this.freeStatus('이어받는 음에는 새 표가 없어야 해요. 다음 음의 표를 없음으로 바꿔요.');n.tie=true;}
    }
    if(previous&&previous.tie&&(!sameSlot(previous,n)||n.acc!==null))return this.freeStatus('붙임줄로 이어받는 음이에요. 먼저 앞 음의 붙임줄을 풀어 주세요.');
    if(n.tie&&(!copy.notes[f.i+1]||!sameSlot(n,copy.notes[f.i+1])))return this.freeStatus('붙임줄을 먼저 풀고 음높이를 바꿔요.');
    const bad=check(copy);if(bad.length)return this.freeStatus('이 자리에는 붙임줄을 놓을 수 없어요. 이웃한 음과 새 표를 확인해요.');

  updateCompare() {

  async playFree(compare) {

  }

const $ = id => document.getElementById(id);
const escapeHtml = text => String(text??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function musicalHtml(value) {
  let text=String(value??'');
  if (typeof Game!=='undefined' && Game.save?.settings.names==='ko') {
    for (const [a,b] of [['더블플랫','겹내림표'],['더블샵','겹올림표'],['내추럴','제자리표'],['플랫','내림표'],['샵','올림표']]) text=text.replaceAll(a,b);
  }
  return escapeHtml(text).replace(/𝄪|𝄫|♯|♭|♮/gu,g=>`<span class="inline-sign">${Visuals.sign({'𝄪':2,'𝄫':-2,'♯':1,'♭':-1,'♮':0}[g],18)}</span>`);
}

 const paths={sound:'<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8c3 2 3 6 0 8m3-11c5 4 5 10 0 14"/>',mute:'<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="m17 9 5 6m0-6-5 6"/>',settings:'<path d="m10 3-1 3-3 1-3 3 2 3-1 3 3 3 3-1 3 1 3-2 3-1 1-4-2-2 1-3-3-3-3 1z"/><circle cx="12" cy="12" r="3"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',book:'<path d="M12 6C9 3 4 4 3 5v15c3-2 6-2 9 0 3-2 6-2 9 0V5c-3-1-6-1-9 1v14"/>',play:'<path d="m9 5 11 7-11 7z"/>',star:'<path d="m12 3 2 6 7 3-7 2-2 7-2-7-7-2 7-3z"/>',lock:'<rect x="6" y="10" width="12" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',check:'<path d="m5 12 4 4L19 6"/>',home:'<path d="m3 11 9-8 9 8M6 9v12h12V9m-9 12v-7h6v7"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',back:'<path d="m14 5-7 7 7 7"/>',wand:'<path d="m5 20 12-12 3 3L8 23zM5 2v6M2 5h6M19 1v4m-2-2h4M20 18v5m-2-2h5"/>'};
 return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.star}</svg>`;

// 13 TESTS — pure, named checks. No DOM changes, storage writes, or audio playback.
// Full 2.59M-score regression remains a separate Node script.
function runSelfTests(options = {}) {
  const results = [];
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const test = (id, name, checkFn) => {
    try {
      const passed = !!checkFn();
      results.push({ id, name, passed, ...(passed ? {} : { error: '검사 결과가 기대값과 달라요.' }) });
    } catch (error) { results.push({ id, name, passed: false, error: error.message }); }
  };
  const P = (seed, model) => pitches(parseScore(seed), model).filter(x => x !== null);
  const ON = seed => evaluate(parseScore(seed)).filter(r => !r.rest).map(r => r.onset);
  const missions = DAYS.flatMap(day => day.list);
  const sols = missions.map(solve);
  const solved = id => sols.find(sol => sol.ms.id === id);
  const allTexts = [];
  const feedback = [];
  for (const sol of sols) {
    allTexts.push(orderText(sol), explain(sol), giveText(sol));
    const { ms, sc, view, t } = sol;
    let wrongs;
    if (ms.ask === 'key') wrongs = keyWindow(sol).panes.flatMap(p => Array.from({ length: p.hi - p.lo + 1 }, (_, k) => p.lo + k));
    else if (ms.ask === 'sign') wrongs = CARDS.slice(ms.cards === 5 ? 1 : 0);
    else if (ms.ask === 'fix') wrongs = sc.notes.flatMap((n, i) => n.rest ? [] : CARDS.map(acc => ({ i, acc })));
    else if (ms.ask === 'reach') {
      const ids = sc.notes.map((n, i) => !n.rest && i !== t ? i : null).filter(i => i !== null);
      wrongs = Array.from({ length: 2 ** ids.length }, (_, mask) => ids.filter((_, k) => (mask >> k) & 1).join(','));
    } else wrongs = choices(sol).map(c => c.v);
    for (const given of wrongs) {
      if (ms.ask === 'fix' && given.acc === view.notes[given.i].acc) continue;
      const cause = diagnose(sol, given);
      if (cause === null) continue;
      const text = say(sol, cause, given);
      feedback.push({ cause, text }); allTexts.push(text);
    }
  }

  test('TH-01', '장음계 공식에서 자연음 반음 자리를 계산해요', () => same([...LETTERS].map((_, L) => natPc(L)), [0, 2, 4, 5, 7, 9, 11]));
  test('TH-02', 'MIDI와 A4 기준 주파수를 계산해요', () => midiOf(0, 4) === 60 && midiOf(5, 4) === 69 && hz(69) === 440 && hz(81) === 880 && Math.abs(hz(60) - 261.6256) < .001);
  test('TH-03', '조표의 차례와 일곱 조표의 개수가 맞아요', () => keyLetters(7).map(L => LETTERS[L]).join('') === 'FCGDAEB' && keyLetters(-7).map(L => LETTERS[L]).join('') === 'BEADGCF' && Array.from({ length: 15 }, (_, i) => i - 7).every(k => [...LETTERS].filter((_, L) => keyAlter(k, L)).length === Math.abs(k)));
  test('TH-04', '높은음자리 조표를 올바른 계단에 그려요', () => same(keySteps(7), [38, 35, 39, 36, 33, 37, 34]) && same(keySteps(-7), [34, 37, 33, 36, 32, 35, 31]));
  test('TH-05', '한 옥타브에는 흰 건반 일곱 개가 있어요', () => Array.from({ length: 12 }, (_, k) => 60 + k).filter(isWhite).length === 7 && keyKo(65) === 'F4' && keyKo(61) === 'C♯4·D♭4');
  test('TH-06', '음이름과 표 이름의 한국어 조사가 맞아요', () => josa('샵', '은/는') === '샵은' && josa('올림표', '은/는') === '올림표는' && be('G♯4') === 'G♯4예요' && be('B3') === 'B3이에요' && ro('내추럴') === '내추럴로' && ro('샵') === '샵으로');
  test('TH-07', '분수는 기약분수이고 분모가 양수예요', () => same(F(6, -8), { n: -3, d: 4 }) && same(F(0, 16), { n: 0, d: 1 }));
  test('TH-08', '서로 다른 분모의 음표 길이를 정확히 더해요', () => eq(add(F(1, 4), F(1, 2)), F(3, 4)) && eq(add(F(1, 3), F(1, 6)), F(1, 2)));
  test('TH-09', '점음표의 길이는 정확한 분수예요', () => eq(noteWhole(2, 1), F(3, 4)) && eq(noteWhole(4, 2), F(7, 16)) && beats(noteWhole(2, 1), 4) === 3);
  test('TH-10', '줄·칸 계단은 음이름과 옥타브로 정해요', () => stepOf(2, 4) === 30 && stepOf(3, 5) === 38 && stepOf(4, 5) - stepOf(4, 4) === 7);
  test('TH-11', '씨앗에서 쉼표와 빈 표 자리와 마디를 읽어요', () => { const sc = parseScore('k1 2/4 | r/4 F?4/4 | F4/2* |'); return sc.key === 1 && sc.bars === 2 && sc.notes[0].rest && sc.notes[1].blank && sc.notes[1].acc === null && sc.notes[2].target && sc.notes[2].bar === 1; });
  test('TH-12', '표를 바꿔도 원본 악보는 변하지 않아요', () => { const sc = parseScore('k0 4/4 | C#4/1 |'), before = JSON.stringify(sc), changed = withAcc(sc, 0, -1); return JSON.stringify(sc) === before && changed.notes[0].acc === -1 && sc.notes[0].acc === 1; });
  test('TH-13', '다섯 표의 한국어·영어 이름과 칸 수가 맞아요', () => signKo(2) === '더블샵' && signKo(-2, 'ko') === '겹내림표' && signEn(0) === 'natural' && notchKo(-2) === '아래로 2칸' && notchKo(0) === '제자리');
  test('TH-14', '곡선은 같은 줄·칸과 뒤의 새 표로 구분해요', () => linkKind(parseScore('k0 2/4 | Bb4/4^ B4/4 |'), 0) === 'tie' && linkKind(parseScore('k0 2/4 | F#4/4^ Fn4/4 |'), 0) === 'slur' && linkKind(parseScore('k0 2/4 | G#4/4^ G5/4 |'), 0) === 'slur');
  test('TH-15', '붙임줄 소리 목록은 길이를 합하고 새 발음을 하나로 세요', () => { const sc = parseScore('k0 2/4 | C#4/4~ C4/4 | C4/2 |'), list = sounds(sc); return list.length === 2 && same(list[0].notes, [0, 1]) && eq(list[0].len, F(1, 2)) && eq(list[1].at, F(1, 2)) && hasPlay(sc); });

  test('EV-01', 'C4에 샵을 붙이면 61이에요', () => same(P('k0 4/4 | C#4/1 |'), [61]));
  test('EV-02', 'E샵4는 흰 건반 F4예요', () => same(P('k0 4/4 | E#4/1 |'), [65]) && isWhite(65));
  test('EV-03', 'C더블샵4는 D4예요', () => same(P('k0 4/4 | Cx4/1 |'), [62]));
  test('EV-04', 'D더블플랫4는 C4예요', () => same(P('k0 4/4 | Dbb4/1 |'), [60]));
  test('EV-05', '더블샵은 앞의 샵에 더하지 않아요', () => same(P('k0 2/4 | C#4/4 Cx4/4 |'), [61, 62]) && same(P('k0 2/4 | C#4/4 Cx4/4 |', MODELS.ADD), [61, 63]));
  test('EV-06', '같은 마디의 같은 자리에 표가 닿아요', () => same(P('k0 2/4 | G#4/4 G4/4 |'), [68, 68]));
  test('EV-07', '표가 다른 옥타브에는 닿지 않아요', () => same(P('k0 2/4 | G#4/4 G5/4 |'), [68, 79]));
  test('EV-08', '마디선을 지나면 마디 기억을 비워요', () => same(P('k0 2/4 | G#4/4 r/4 | G4/4 r/4 |'), [68, 67]));
  test('EV-09', '내추럴 다음 마디에는 조표로 돌아가요', () => same(P('k1 2/4 | Fn4/4 r/4 | F4/4 r/4 |'), [65, 66]));
  test('EV-10', '더블샵 뒤 내추럴은 자연음이에요', () => same(P('k0 2/4 | Cx4/4 Cn4/4 |'), [62, 60]));
  test('EV-11', '붙임줄은 마디선을 지나 같은 소리를 이어요', () => same(P('k0 2/4 | r/4 G#4/4~ | G4/4 r/4 |'), [68, 68]) && same(ON('k0 2/4 | r/4 G#4/4~ | G4/4 r/4 |'), [true, false]));
  test('EV-12', 'T1 붙임줄 뒤 새 음은 자연음으로 계산해요', () => same(P('k0 4/4 | r/2. F#4/4~ | F4/4 F4/4 r/2 |'), [66, 66, 65]) && same(ON('k0 4/4 | r/2. F#4/4~ | F4/4 F4/4 r/2 |'), [true, false, true]));
  test('EV-13', 'T2 조표와 내추럴 붙임줄은 서로 다른 상태예요', () => same(P('k1 4/4 | r/2. Fn4/4~ | F4/4 F4/4 r/2 |'), [65, 65, 66]));
  test('EV-14', 'T3 붙임줄 뒤 새 내추럴을 붙일 수 있어요', () => same(P('k1 4/4 | r/2. Fn4/4~ | F4/4 Fn4/4 r/2 |'), [65, 65, 65]));
  test('EV-15', 'T4 이음줄은 표를 다음 마디로 옮기지 않아요', () => same(P('k0 2/4 | (G#4/4 A4/4 | G4/4) r/4 |'), [68, 69, 67]));
  test('EV-16', 'T5 같은 음이름의 다른 옥타브는 다른 자리예요', () => same(P('k0 2/4 | G#4/4 G5/4 |'), [68, 79]));
  test('EV-17', 'T6 조표는 모든 옥타브에 걸려요', () => same(P('k3 2/4 | G4/4 G5/4 |'), [68, 80]));
  test('EV-18', 'T7 붙임줄 사슬은 네 박짜리 한 소리예요', () => { const seed = 'k0 2/4 | r/4 C#4/4~ | C4/2~ | C4/4 C4/4 |', list = sounds(parseScore(seed)); return same(P(seed), [61, 61, 61, 60]) && list.length === 2 && beats(list[0].len, 4) === 4 && list[0].notes.length === 3; });
  test('EV-19', 'T8 붙임줄로 이어받는 음의 새 표는 충돌이에요', () => check(parseScore('k0 2/4 | F#4/4~ Fn4/4 |')).includes('TIE_SIGN:0'));
  test('EV-20', 'T9 새 샵은 이후의 마디 기억을 갱신해요', () => { const seed = 'k0 4/4 | r/2. F#4/4~ | F4/4 F#4/4 F4/4 r/4 |'; return same(P(seed), [66, 66, 66, 66]) && same(evaluate(parseScore(seed)).filter(r => !r.rest).map(r => r.src), ['sign', 'tie', 'sign', 'mem']); });
  test('EV-21', 'T10 같은 음이 낀 이음줄도 각각 새로 내요', () => { const sc = parseScore('k0 4/4 | (E4/4 E4/4 G4/4) r/4 |'); return sounds(sc).length === 3 && check(sc).length === 0 && check(parseScore('k0 2/4 | (E4/4 E4/4) |')).includes('SLUR_READS_AS_TIE:0'); });
  const maxLength = options.exhaustive ? 3 : 2;
  test('EV-22', `독립된 느린 계산과 길이 ${maxLength}까지의 모든 악보를 비교해요`, () => {
    const accs = [null, 1, -1, 0, 2, -2], slots = [[4, 4], [4, 5], [5, 4]];
    let seen = 0;
    for (const key of [0, 3, -3]) for (let len = 1; len <= maxLength; len++) {
      for (let code = 0; code < 18 ** len; code++) for (let bars = 0; bars < 2 ** (len - 1); bars++) {
        const notes = []; let c = code, bar = 0;
        for (let i = 0; i < len; i++) { const slot = slots[c % 3]; c = Math.floor(c / 3); const acc = accs[c % 6]; c = Math.floor(c / 6); if (i && ((bars >> (i - 1)) & 1)) bar++; notes.push({ rest: false, L: slot[0], o: slot[1], acc, bar, tie: false, curve: false }); }
        const sc = { key, notes, slurs: [], bars: bar + 1 };
        const oracle = notes.map((n, i) => { let a = n.acc; for (let j = i - 1; a === null && j >= 0 && notes[j].bar === n.bar; j--) if (sameSlot(notes[j], n) && notes[j].acc !== null) a = notes[j].acc; return midiOf(n.L, n.o, a === null ? keyAlter(key, n.L) : a); });

  test('EV-23', '뒤 음의 표를 바꿔도 앞 음의 높이는 그대로예요', () => { const sc = parseScore('k1 4/4 | F4/4 Fn4/4 F5/4 F4/4 | F4/4 F#4/4 F4/4 r/4 |'), before = pitches(sc); return sc.notes.every((n, i) => n.rest || CARDS.every(acc => pitches(withAcc(sc, i, acc)).slice(0, i).every((p, j) => p === before[j]))); });
  test('EV-24', '새 표는 앞의 표와 관계없이 자연음에서 계산해요', () => CARDS.every(a => [1, -1, 0, 2, -2].every(b => pitches({ key: 3, bars: 1, slurs: [], notes: [{ rest: false, L: 4, o: 4, acc: a, bar: 0 }, { rest: false, L: 4, o: 4, acc: b, bar: 0 }] })[1] === midiOf(4, 4, b))));

  test('MD-01', '오개념 열아홉 개 모두 표준과 다른 결과를 내요', () => { const probes = ['k0 4/4 | E#4/1 |', 'k0 2/4 | C#4/4 Cx4/4 |', 'k0 2/4 | Cx4/4 Cn4/4 |', 'k0 2/4 | Db4/4 Dn4/4 |', 'k1 4/4 | Fn4/4 G4/4 F4/4 F5/4 |', 'k0 2/4 | G#4/4 G5/4 |', 'k0 2/4 | G#4/4 A4/4 | G4/4 r/4 |', 'k0 4/4 | F4/4 G4/4 F#4/4 F4/4 |', 'k3 2/4 | G5/4 G4/4 |', 'k0 4/4 | r/2. F#4/4~ | F4/4 F4/4 r/2 |', 'k0 2/4 | (G#4/4 A4/4 | G4/4) r/4 |', 'k0 4/4 | Cx4/1 |']; return Object.keys(MODELS).length === 19 && Object.values(MODELS).every(m => probes.some(seed => !same(P(seed), P(seed, m)))); });
  test('MD-02', '겨눈 오답의 원인을 우선 진단하고 정답은 원인이 없어요', () => sols.every(sol => { const answer = sol.ms.ask === 'fix' ? sol.answer[0] : sol.answer; if (diagnose(sol, answer) !== null) return false; if (!sol.ms.aim || !(sol.ms.aim in sol.traps)) return true; const expected = sol.ms.ask === 'why' ? 'WHY' : sol.ms.ask === 'sign' && sol.answer === null ? 'REDUNDANT' : sol.ms.aim; return diagnose(sol, sol.traps[sol.ms.aim]) === expected; }));
  test('MD-03', '모든 오개념에 의뢰와 규칙 카드가 있어요', () => { const aimed = new Set(sols.filter(s => s.ms.aim in s.traps).map(s => s.ms.aim)); return Object.keys(MODELS).every(code => aimed.has(code)) && same(RULE_CARDS.flatMap(c => c.aims).sort(), Object.keys(MODELS).sort()); });

  test('GN-01', '의뢰 66건과 발견 장면 악보가 출제 검사를 통과해요', () => sols.length === 66 && sols.every(sol => !check(sol.sc).length && !check(sol.view).length) && Object.values(SCENES).every(scene => scene.rows.every(seed => !check(parseScore(seed)).length)));
  test('GN-02', '의뢰의 답은 하나이고 수리 방법도 하나예요', () => sols.every(sol => sol.t >= 0 && (sol.ms.ask === 'fix' ? sol.answer.length === 1 && sol.answer[0].i === sol.ms.bad.i && sol.answer[0].acc === sol.sc.notes[sol.ms.bad.i].acc : sol.answer !== undefined)));
  test('GN-03', '겨누는 오개념은 정답과 다른 답을 내요', () => sols.every(sol => !sol.ms.aim || ['fix', 'link', 'name'].includes(sol.ms.ask) || sol.ms.aim in sol.traps));
  test('GN-04', '완성 악보에는 없어도 되는 표가 없어요', () => sols.every(sol => ['name', 'notch'].includes(sol.ms.ask) || redundant(sol.ms.ask === 'sign' ? withAcc(sol.sc, sol.t, sol.answer) : sol.sc).length === 0));
  test('GN-05', '건반 창은 흰 건반 일곱 개 이하이고 필요한 음을 모두 담아요', () => sols.every(sol => { const window = keyWindow(sol), need = pitches(sol.sc).concat(pitches(sol.view)).filter(n => n !== null); if (sol.ms.ask === 'key') need.push(...Object.values(sol.traps)); return window.whites <= 7 && window.panes.every(p => isWhite(p.lo) && isWhite(p.hi)) && need.every(n => window.panes.some(p => n >= p.lo && n <= p.hi)); }));
  test('GN-06', '302px 악보에서 음표 한 칸은 26px 이상이에요', () => sols.every(sol => unitPx(sol.view, 302) >= 26));
  test('GN-07', '작업일별 의뢰 수는 8·8·8·8·8·8·10·8이에요', () => same(DAYS.map(day => day.list.length), [8, 8, 8, 8, 8, 8, 10, 8]));
  test('GN-08', '작업일마다 마감 의뢰가 하나이고 마지막이에요', () => DAYS.every(day => day.list.filter(ms => ms.final).length === 1 && day.list[day.list.length - 1].final));
  test('GN-09', '발견 장면 일곱 개는 한 번씩 배치되어 있어요', () => Object.keys(SCENES).length === 7 && DAYS.flatMap(day => [day.scene, ...day.list.map(ms => ms.after)]).filter(Boolean).sort().join('') === 'S1S2S3S4S5S6S7');
  test('GN-10', '모든 의뢰의 겨냥 코드가 실제 모델에 있어요', () => missions.every(ms => !ms.aim || ms.aim in MODELS));
  test('GN-11', '모든 보기와 카드 목록에 정답이 들어 있어요', () => sols.every(sol => { const opts = choices(sol); return (!opts.length || opts.some(c => c.v === sol.answer)) && (sol.ms.ask !== 'sign' || CARDS.slice(sol.ms.cards === 5 ? 1 : 0).includes(sol.answer)); }));

  test('CT-01', '가능한 모든 오답에 원인과 유효한 안내문이 나와요', () => feedback.length > 0 && feedback.every(f => typeof f.cause === 'string' && typeof f.text === 'string' && f.text.length > 4 && !/undefined|NaN|null/.test(f.text)));
  test('CT-02', '의뢰·풀이·정답 안내문에 누락된 계산값이 없어요', () => sols.every(sol => [orderText(sol), explain(sol), giveText(sol)].every(text => typeof text === 'string' && text.length > 4 && !/undefined|NaN|null/.test(text))));
  test('CT-03', '학습 문장에 금지한 오해 표현이 없어요', () => allTexts.concat(Object.values(SCENES).map(s => s.text)).every(text => !['원래 음', '두 번 올', '두 번 내', '같은 음이면', '병행조'].some(word => text.includes(word))));
  test('CT-04', '정답률 네 갈래의 의뢰 수는 7·17·31·11이에요', () => { const counts = { sym: 0, semi: 0, reach: 0, notate: 0 }; DAYS.forEach((day, i) => day.list.forEach(ms => counts[categoryOf(ms, i)]++)); return same(counts, { sym: 7, semi: 17, reach: 31, notate: 11 }); });

  const emptySave = () => ({ days: {}, review: [] });
  const resultsFor = (dayIndex, count, hand = '기계') => DAYS[dayIndex].list.map((ms, i) => ({ id: ms.id, mark: i < count ? 'full' : 'half', hand }));
  test('ST-01', '새 작업일은 정해진 순서와 빈 결과로 시작해요', () => DAYS.every((day, i) => { const s = Session.create(i, emptySave()); return s.day === day.id && s.index === 0 && !s.results.length && same(s.queue, day.list.map(ms => ms.id)); }));
  test('ST-02', '이전 작업일 복습은 앞에서 두 건까지만 끼워요', () => { const save = { days: {}, review: ['d1-01', 'd0-01', 'd0-02', 'd2-01'] }; return same(Session.create(1, save).queue.slice(0, 3), ['d0-01', 'd0-02', 'd1-01']); });
  test('ST-03', '작업일 생성은 저장 데이터와 원본 씨앗을 바꾸지 않아요', () => { const save = { days: {}, review: ['d0-01'] }, before = JSON.stringify([save, DAYS]); Session.create(1, save); return JSON.stringify([save, DAYS]) === before; });
  test('ST-04', '복습과 다시 나온 의뢰는 통과용 의뢰와 구분해요', () => { const s = Session.create(1, { days: {}, review: ['d0-01'] }); s.queue.push('d1-01'); return Session.isExtra(s, 'd0-01', 0) && !Session.isExtra(s, 'd1-01', 1) && Session.isExtra(s, 'd1-01', s.queue.length - 1); });
  test('ST-05', '다시 내기는 세 의뢰 뒤에 넣고 원래 줄은 보존해요', () => { const s = Session.create(0, emptySave()), before = JSON.stringify(s.queue), q = Session.repeat(s, DAYS[0].list[0]); return q[4] === 'd0-01' && q.length === 9 && JSON.stringify(s.queue) === before; });
  test('ST-06', '남은 의뢰가 적으면 마감 의뢰 바로 앞에 다시 내요', () => { const s = Session.create(0, emptySave()); s.index = 6; const q = Session.repeat(s, DAYS[0].list[6]); return q[q.length - 2] === 'd0-07' && q[q.length - 1] === 'd0-08'; });
  test('ST-07', '마감 의뢰는 다시 내지 않아요', () => { const s = Session.create(0, emptySave()); s.index = 7; return same(Session.repeat(s, DAYS[0].list[7]), s.queue); });
  test('ST-08', '복습과 다시 내기는 재귀적으로 반복하지 않아요', () => { const s = Session.create(1, { days: {}, review: ['d0-01'] }); if (!same(Session.repeat(s, DAYS[0].list[0]), s.queue)) return false; s.index = 3; s.queue = Session.repeat(s, DAYS[1].list[2]); s.index = s.queue.lastIndexOf('d1-03'); return same(Session.repeat(s, DAYS[1].list[2]), s.queue); });
  test('ST-09', '여덟 의뢰는 첫 정답 일곱 개부터 통과해요', () => { const s = Session.create(0, emptySave()); s.results = resultsFor(0, 6); if (Session.summary(s).passed || Session.summary(s).needed !== 7) return false; s.results = resultsFor(0, 7); return Session.summary(s).passed && Session.summary(s).full === 7; });
  test('ST-10', '열 의뢰는 첫 정답 여덟 개부터 통과해요', () => { const s = Session.create(6, emptySave()); s.results = resultsFor(6, 7); if (Session.summary(s).passed || Session.summary(s).needed !== 8) return false; s.results = resultsFor(6, 8); return Session.summary(s).passed && Session.summary(s).total === 10; });
  test('ST-11', '복습과 다시 내기의 정답은 통과 계산에서 빼요', () => { const s = Session.create(0, emptySave()); s.results = resultsFor(0, 6).concat([{ id: 'd0-01', mark: 'full', hand: '매끈', again: true }, { id: 'd1-01', mark: 'full', hand: '매끈', again: true }]); const sum = Session.summary(s); return sum.full === 6 && !sum.passed; });
  test('ST-12', '다음 작업일은 바로 앞 작업일을 통과하면 열려요', () => Session.unlock(emptySave(), 0) && !Session.unlock(emptySave(), 1) && Session.unlock({ days: { d0: { passed: true } } }, 1) && !Session.unlock({ days: { d0: { passed: true } } }, 2));
  test('ST-13', '연주 기록은 통과와 별개이고 매끈 도장은 따로 계산해요', () => { const s = Session.create(2, emptySave()); s.results = resultsFor(2, 8, '기계'); const a = Session.summary(s); s.results = resultsFor(2, 8, '매끈'); const b = Session.summary(s); return a.passed && b.passed && a.full === b.full && !a.smooth && b.smooth; });

  const report = { passed: results.filter(r => r.passed).length, total: results.length, results };
  if (typeof window !== 'undefined') window.__tests = report;
  return report;
}

boot();
</script></body></html>
